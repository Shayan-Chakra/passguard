<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PassGuard</title>
<style>
  :root {
    --ink: #14172B;
    --ink-soft: #3B4160;
    --mist: #F3F5FB;
    --card: #FFFFFF;
    --line: #E1E5F2;
    --violet: #5B4BFF;
    --violet-dark: #4536E0;
    --mint: #17B890;
    --amber: #F5A524;
    --orange: #F07C2A;
    --coral: #E8455F;
    --lvl: #B7BDD3;          /* current risk colour, changed by JS */
  }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; background: var(--mist); color: var(--ink);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--ink); color: #fff; padding: 16px 18px 46px;
    display: flex; align-items: center; gap: 10px;
  }
  header svg { flex: none; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .pill {
    margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 99px;
    background: rgba(23,184,144,.18); color: #6EE7C5; white-space: nowrap;
  }

  main { padding: 0 14px 14px; margin-top: -32px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px;
  }
  .card + .card { margin-top: 12px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-soft); font-weight: 600; }

  /* ---------- Tester ---------- */
  #tester[data-level="low"]      { --lvl: var(--mint); }
  #tester[data-level="moderate"] { --lvl: var(--amber); }
  #tester[data-level="high"]     { --lvl: var(--orange); }
  #tester[data-level="critical"] { --lvl: var(--coral); }

  .gauge { position: relative; width: 200px; height: 110px; margin: 0 auto 4px; }
  .gauge svg { display: block; }
  .track, .fill { fill: none; stroke-width: 14; stroke-linecap: round; }
  .track { stroke: var(--line); }
  .fill  { stroke: var(--lvl); stroke-dasharray: 251.33; stroke-dashoffset: 251.33;
           transition: stroke-dashoffset .5s ease, stroke .3s ease; }
  .gauge-text { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
  .gauge-level { font-size: 22px; font-weight: 700; color: var(--lvl); line-height: 1.1; }
  .gauge-score { font-size: 12px; color: var(--ink-soft); }

  .field { position: relative; margin-top: 8px; }
  .field input {
    width: 100%; padding: 10px 40px 10px 12px; font: inherit;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--mist);
    color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--violet); background: #fff; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; cursor: pointer; padding: 4px 6px; font-size: 16px;
  }
  .reasons { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .reasons li { display: flex; gap: 8px; padding: 4px 0; color: var(--ink-soft); }
  .reasons li::before {
    content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px;
    border-radius: 50%; background: var(--lvl);
  }
  .hint { margin: 10px 0 0; font-size: 12px; color: var(--ink-soft); }

  /* ---------- Generator ---------- */
  .output {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--ink); color: #fff; border-radius: 10px;
    font: 14px/1.3 ui-monospace, Consolas, "Courier New", monospace;
  }
  #pwOut { flex: 1; word-break: break-all; user-select: all; }
  .icon-btn {
    flex: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff; font-size: 15px;
  }
  .icon-btn:hover { background: rgba(255,255,255,.22); }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .row label.name { font-size: 13px; color: var(--ink-soft); min-width: 52px; }
  input[type=range] { flex: 1; accent-color: var(--violet); }
  #lenVal { width: 24px; text-align: right; font-weight: 700; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-block; padding: 5px 11px; border-radius: 99px; cursor: pointer;
    border: 1.5px solid var(--line); font-size: 12.5px; color: var(--ink-soft);
    user-select: none;
  }
  .chip input:checked + span { background: var(--violet); border-color: var(--violet); color: #fff; }
  .chip input:focus-visible + span { outline: 2px solid var(--violet); outline-offset: 2px; }

  .primary {
    width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 10px;
    background: var(--violet); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .primary:hover { background: var(--violet-dark); }
  .primary.done { background: var(--mint); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  footer { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding: 0 14px 14px; }

  @media (prefers-reduced-motion: reduce) {
    .fill, .primary { transition: none; }
  }

  /* ---------- Compact height ---------- */
  header { padding: 12px 16px 36px; }
  main { margin-top: -26px; padding: 0 12px 10px; }
  .card { padding: 12px; }
  .card + .card { margin-top: 10px; }
  h2 { margin: 0 0 4px; }
  .gauge, .gauge svg { width: 160px; height: 88px; }
  .gauge { margin-bottom: 0; }
  .gauge-level { font-size: 19px; }
  .field { margin-top: 4px; }
  .field input { padding: 8px 40px 8px 12px; }
  #hint, footer { display: none !important; }
  .reasons { margin-top: 6px; max-height: 72px; overflow-y: auto; }
  .output { padding: 8px 10px; }
  .row { margin-top: 8px; }
  .chips { margin-top: 8px; }
  .primary { margin-top: 10px; padding: 9px; }
</style>
</head>
<body>

<header>
  <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true">
    <path d="M15 1 L28 6 V16 C28 24 22 30 15 33 C8 30 2 24 2 16 V6 Z" fill="#5B4BFF"/>
    <path d="M9.5 17 L13.5 21 L21 12.5" fill="none" stroke="#fff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="brand">PassGuard</span>
  <span class="pill">Local only</span>
</header>

<main>
  <!-- Password tester -->
  <section class="card" id="tester" data-level="none">
    <h2>Test a password</h2>
    <div class="gauge">
      <svg viewBox="0 0 200 110" width="200" height="110" aria-hidden="true">
        <path class="track" d="M20 100 A80 80 0 0 1 180 100"/>
        <path class="fill" id="gaugeFill" d="M20 100 A80 80 0 0 1 180 100"/>
      </svg>
      <div class="gauge-text" aria-live="polite">
        <div class="gauge-level" id="levelText">Waiting</div>
        <div class="gauge-score" id="scoreText">Type below to begin</div>
      </div>
    </div>

    <div class="field">
      <input id="testInput" type="password" placeholder="Type a password to test"
             autocomplete="off" spellcheck="false" aria-label="Password to test">
      <button class="eye" id="eyeBtn" type="button" aria-label="Show password">👁</button>
    </div>

    <ul class="reasons" id="reasons"></ul>
    <p class="hint" id="hint">This box never saves or sends anything. Close the popup and it is gone.</p>
  </section>

  <!-- Generator -->
  <section class="card">
    <h2>Make a strong password</h2>
    <div class="output">
      <span id="pwOut">&nbsp;</span>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Generate a new password">↻</button>
    </div>

    <div class="row">
      <label class="name" for="len">Length</label>
      <input id="len" type="range" min="8" max="32" value="16">
      <span id="lenVal">16</span>
    </div>

    <div class="chips">
      <label class="chip"><input type="checkbox" id="optUpper" checked><span>ABC</span></label>
      <label class="chip"><input type="checkbox" id="optLower" checked><span>abc</span></label>
      <label class="chip"><input type="checkbox" id="optNumbers" checked><span>123</span></label>
      <label class="chip"><input type="checkbox" id="optSymbols" checked><span>#$%</span></label>
    </div>

    <button class="primary" id="copyBtn" type="button">Copy password</button>
  </section>
</main>

<footer>Your passwords are checked on this device only.</footer>

<script src="lib/zxcvbn.js"></script>
<script src="riskEngine.js"></script>
<script src="generator.js"></script>
<script src="popup.js"></script>
</body>
</html>
